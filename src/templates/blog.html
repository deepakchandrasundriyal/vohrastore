<section class="border-b border-line bg-paper">
  <div class="container py-12 sm:py-14">
    <nav class="text-[13px] text-muted" aria-label="Breadcrumb"><a href="index.html" class="hover:text-ink">Home</a><span class="mx-1.5">/</span><a href="blogs.html" class="hover:text-ink">Blogs</a><span class="mx-1.5">/</span><span class="text-ink">{{b_category}}</span></nav>
    <div class="mx-auto max-w-3xl text-center">
      <span class="tag mt-6 bg-gold-soft text-ink">{{b_category}}</span>
      <h1 class="h-section mt-4">{{b_title}}</h1>
      <p class="mt-4 text-[13.5px] text-muted"><time datetime="{{b_date}}">{{b_date_label}}</time> · {{b_read}}</p>
    </div>
  </div>
</section>

<section class="container py-10 sm:py-14">
  <div class="mx-auto max-w-4xl overflow-hidden rounded-[22px] border border-line bg-sand">
    <img src="{{b_image}}" alt="" class="w-full aspect-[16/9] object-cover">
  </div>
  <article class="prose-v mx-auto mt-10">
    {{b_body}}
  </article>
  <div class="mx-auto mt-10 max-w-prose flex flex-wrap items-center justify-between gap-4 border-t border-line pt-6">
    <a href="blogs.html" class="btn-line btn-sm">{{icon:arrow-left|w-4 h-4}} All blogs</a>
    <a href="shop.html" class="btn-ink btn-sm">Shop makhana {{icon:arrow|w-4 h-4}}</a>
  </div>
</section>

<section class="bg-sand/70 border-t border-line py-14 sm:py-20">
  <div class="container">
    <h2 class="h-section text-center">More from the journal</h2>
    <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      {{b_related}}
    </div>
  </div>
</section>

<script type="application/ld+json">{{b_jsonld}}</script>
